[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nexfin-invoice"
version = "0.1.0"
description = "Convert invoice PDFs (ZUGFeRD/Factur-X/XRechnung or plain) into nexfin inbox Markdown files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "nexfin-invoice contributors" }]
keywords = ["invoice", "zugferd", "factur-x", "xrechnung", "e-invoice", "markdown", "nexfin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pikepdf>=8",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
nexfin-invoice = "nexfin_invoice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexfin_invoice"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
files = ["src/nexfin_invoice"]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*"]
ignore_missing_imports = true
